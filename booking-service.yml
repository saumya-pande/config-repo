server:
  port: 8082

resilience4j:
  circuitbreaker:
    instances:
      MovieClientgetMovieByIdlong:
        register-health-indicator: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 10
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0